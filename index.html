<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0071e3"><link rel="apple-touch-icon" href="icon-192.png">
<title>Holpin — Coordiná tus viajes</title>
<style>
:root{--bg:#fbfbfd;--card:#fff;--tx:#1d1d1f;--tx2:#6e6e73;--line:#d2d2d7;--blue:#0071e3;--red:#ff3b30;--green:#1d9b4a;--glass:rgba(251,251,253,.8);--fill:#f5f5f7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--tx2:#a1a1a6;--line:#38383a;--blue:#2997ff;--green:#30d158;--glass:rgba(0,0,0,.72);--fill:#2c2c2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--tx2:#a1a1a6;--line:#38383a;--blue:#2997ff;--green:#30d158;--glass:rgba(0,0,0,.72);--fill:#2c2c2e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav b{font-size:19px;letter-spacing:-.02em}
#tabs{display:flex;gap:4px;flex:1;overflow-x:auto}
#tabs button{border:0;background:none;color:var(--tx2);font:inherit;font-size:14px;padding:6px 10px;border-radius:980px;cursor:pointer;position:relative;white-space:nowrap}
#tabs button.on{color:var(--tx);background:var(--fill)}
.dot{background:var(--red);color:#fff;border-radius:980px;font-size:11px;padding:1px 6px;margin-left:4px}
.avbtn{border:0;background:none;padding:0;cursor:pointer}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--fill);flex:none;display:block}
.avbtn .av{width:32px;height:32px}
main{max-width:760px;margin:0 auto;padding:0 18px 60px}
.hero{text-align:center;padding:44px 0 26px}
h1{font-size:clamp(34px,8vw,56px);line-height:1.05;letter-spacing:-.03em;margin:0 0 12px;font-weight:700}
.hero p{color:var(--tx2);font-size:19px;margin:0 auto 24px;max-width:520px}
.seg{display:inline-flex;background:var(--fill);border-radius:980px;padding:3px}
.seg button{border:0;background:none;font:inherit;font-size:15px;color:var(--tx);padding:9px 20px;border-radius:980px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.18);font-weight:600}
.panel{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 2px 14px rgba(0,0,0,.06);margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--tx2);margin:0 0 5px 4px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--fill);border:1px solid transparent;border-radius:12px;padding:12px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--blue)}
.btn{border:0;background:var(--blue);color:#fff;font:inherit;font-size:15px;padding:11px 20px;border-radius:980px;cursor:pointer}
.btn.sec{background:var(--fill);color:var(--blue)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
h2{font-size:24px;letter-spacing:-.02em;margin:26px 0 12px}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:0 2px 14px rgba(0,0,0,.06)}
.row{display:flex;align-items:center;gap:12px}
.row .g{flex:1;min-width:0}
.row small,.meta{color:var(--tx2);font-size:14px}
.price{font-size:20px;font-weight:600}
.route{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:14px 0 4px}
.route i{color:var(--tx2);font-style:normal;margin:0 6px}
.badge{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:980px}
.ok{color:var(--green)}
.acts{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.empty{text-align:center;color:var(--tx2);padding:36px 0}
.msg{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.msg:last-child{border:0}
.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ov[hidden]{display:none}
.sheet{background:var(--card);border-radius:26px;padding:24px;width:100%;max-width:420px;max-height:90%;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}
.sheet p{color:var(--tx2);margin:0 0 16px;font-size:15px}
.pic{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.pic .av{width:72px;height:72px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:980px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
/* ---- Animaciones ---- */
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:none}}
@keyframes bounce{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes float{to{transform:translateY(26px) scale(1.12)}}
.hero{position:relative}
.hero::before{content:"";position:absolute;inset:-30px 12% auto;height:260px;background:radial-gradient(closest-side,rgba(0,113,227,.22),transparent);filter:blur(30px);z-index:-1;pointer-events:none;animation:float 7s ease-in-out infinite alternate}
.hero h1{animation:up .8s cubic-bezier(.2,.8,.2,1) both}
.hero p{animation:up .8s .12s cubic-bezier(.2,.8,.2,1) both}
.hero .seg{animation:up .8s .24s cubic-bezier(.2,.8,.2,1) both}
section[id^="v-"]:not([hidden]){animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.card{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.card.new{animation:up .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.14)}
.route i{display:inline-block;transition:transform .3s}
.card:hover .route i{transform:translateX(6px)}
.btn,.seg button,#tabs button{transition:transform .15s,opacity .2s,background .25s,box-shadow .25s,color .2s}
.btn:hover:not(:disabled){opacity:.88}
.btn:active:not(:disabled),.seg button:active{transform:scale(.94)}
input,textarea{transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{box-shadow:0 0 0 4px rgba(0,113,227,.18)}
.badge,.dot{animation:bounce .45s both}
.ov:not([hidden]){animation:fade .25s both}
.ov:not([hidden]) .sheet{animation:pop .4s cubic-bezier(.2,.9,.3,1.15) both}
#toast{transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.3,1.2)}
#toast.on{transform:translateX(-50%) translateY(-8px)}
.av{transition:transform .25s}
.card:hover .av{transform:scale(1.08)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ---- Animaciones extra ---- */
@keyframes grad{to{background-position:100% 0}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes bump{50%{transform:scale(1.5);color:var(--blue)}}
@keyframes nudge{50%{transform:translateX(5px)}}
@keyframes sway{to{transform:translate(-30px,20px) scale(1.15)}}
.hero h1{background:linear-gradient(90deg,var(--tx) 0%,var(--blue) 35%,#af52de 65%,var(--tx) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:up .8s cubic-bezier(.2,.8,.2,1) both,grad 9s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0 auto auto 58%;width:240px;height:200px;background:radial-gradient(closest-side,rgba(175,82,222,.18),transparent);filter:blur(30px);z-index:-1;pointer-events:none;animation:sway 9s ease-in-out infinite alternate}
.seg{position:relative}
.seg .pill{position:absolute;top:3px;bottom:3px;left:0;width:0;background:var(--card);border-radius:980px;box-shadow:0 1px 4px rgba(0,0,0,.18);transition:transform .4s cubic-bezier(.3,.9,.3,1.1),width .4s cubic-bezier(.3,.9,.3,1.1)}
.seg button{position:relative;z-index:1}
.seg button.on{background:none;box-shadow:none}
.route i{animation:nudge 2.6s ease-in-out infinite}
b.bump{display:inline-block;animation:bump .5s ease}
.sk{height:150px;border-radius:22px;margin-bottom:12px;background:linear-gradient(90deg,var(--fill) 25%,var(--line) 50%,var(--fill) 75%);background-size:200% 100%;animation:shim 1.3s linear infinite}
.sug{position:absolute;z-index:20;background:var(--card);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;max-height:250px;overflow:auto;animation:pop .22s both}
.sug div{padding:9px 12px;border-radius:9px;cursor:pointer;font-size:15px;transition:background .15s}
.sug div:hover{background:var(--fill)}
.panel{transition:box-shadow .3s}
.panel:focus-within{box-shadow:0 8px 28px rgba(0,113,227,.14)}
/* ---- Chat ---- */
.conv{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.conv:last-child{border:0}
.conv .g{flex:1;min-width:0}
.chath{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.chath .g{flex:1;min-width:0}
.chath .av{width:36px;height:36px}
#cLog{min-height:180px;max-height:50vh;overflow-y:auto;padding:14px 0;display:flex;flex-direction:column;gap:6px}
.bub{max-width:78%;padding:9px 14px;border-radius:18px;font-size:15px;line-height:1.35;word-wrap:break-word;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.bub.th{align-self:flex-start;background:var(--fill);border-bottom-left-radius:6px}
.bub time{display:block;font-size:11px;opacity:.7;margin-top:2px}
.cform{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
/* ---- Chat: animaciones, eliminar y avisos ---- */
@keyframes bub{from{opacity:0;transform:translateY(12px) scale(.9)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateX(34px) scale(.9)}}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-14deg)}45%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(0)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,.55)}100%{box-shadow:0 0 0 10px rgba(255,59,48,0)}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.bub.new{animation:bub .38s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i,0)*40ms)}
.bub.me.new{transform-origin:100% 100%}
.bub.th.new{transform-origin:0 100%}
.bub.out,.conv.out{animation:out .3s ease forwards}
.bub{transition:transform .2s}
.bub:hover{transform:scale(1.02)}
.bdel{border:0;background:none;color:inherit;font:inherit;font-size:11px;opacity:.65;cursor:pointer;margin-left:8px;padding:0;text-decoration:underline;transition:opacity .2s}
.bdel:hover{opacity:1}
.bdel[data-armed]{opacity:1;font-weight:600;color:#ffd1ce}
.bub.th .bdel[data-armed]{color:var(--red)}
.conv{padding-left:10px;padding-right:10px;border-radius:14px;transition:background .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
.conv:hover{background:var(--fill);transform:translateX(4px)}
.conv.new{animation:slide .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
.chath{animation:fade .3s both}
.chath .av{transition:transform .3s}
.chath .av:hover{transform:rotate(-6deg) scale(1.1)}
.cform input{transition:border-color .2s,box-shadow .2s,transform .2s}
.cform input:focus{transform:scale(1.01)}
.cform .btn:active:not(:disabled){transform:scale(.9) rotate(-3deg)}
.dot{animation:bounce .45s both,pulse 2s 1.2s infinite}
#bell{animation:ring 2.4s ease-in-out 1s infinite;transform-origin:50% 0}
#bell:hover{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.bub.new,.conv.new,.bub.out,.conv.out{animation:none!important}}
</style></head><body>
<header class="nav"><b>Holpin</b><nav id="tabs"></nav><button class="btn sec sm" id="bell" title="Activar avisos de mensajes nuevos" aria-label="Activar avisos" hidden>🔔</button><button class="avbtn" id="meBtn" aria-label="Perfil"></button></header>
<main>
<section class="hero" id="hero"><h1>Viajá acompañado.</h1><p>Encontrá un lugar en un auto o publicá tu viaje entre ciudades y repartí los gastos.</p>
<div class="seg" id="roleSeg"><span class="pill"></span><button data-r="pasajero">Soy pasajero</button><button data-r="conductor">Soy conductor</button></div></section>

<section id="v-buscar">
<div class="panel"><div class="grid"><div><label>Salgo desde</label><input id="qFrom" placeholder="Ciudad de salida"></div><div><label>Quiero ir a</label><input id="qTo" placeholder="Ciudad de destino"></div></div></div>
<div id="list"></div></section>

<section id="v-publicar" hidden>
<div class="panel"><h3 style="margin:0 0 14px;font-size:22px">Publicar un viaje</h3>
<div class="grid"><div><label>Desde</label><input id="pFrom" placeholder="Ciudad de salida"></div><div><label>Hasta</label><input id="pTo" placeholder="Ciudad de destino"></div>
<div><label>Fecha</label><input id="pDate" type="date"></div><div><label>Horario de salida</label><input id="pTime" type="time"></div>
<div><label>Monto por persona ($)</label><input id="pPrice" type="number" min="0" inputmode="numeric" placeholder="12000"></div><div><label>Asientos disponibles</label><input id="pSeats" type="number" min="1" max="8" inputmode="numeric" value="3"></div></div>
<div class="acts"><button class="btn" id="pub">Publicar viaje</button></div></div>
<h2>Mis viajes</h2><div id="mine"></div></section>

<section id="v-mensajes" hidden><h2 style="margin-top:0">Mensajes</h2><div class="panel" id="msgs"></div></section>
<div class="meta" style="text-align:center;padding:0 0 28px;font-size:12px">Holpin · versión chat 6</div>
</main>
<datalist id="cities"><option>Buenos Aires</option><option>Córdoba</option><option>Rosario</option><option>Mendoza</option><option>La Plata</option><option>Mar del Plata</option><option>Tucumán</option><option>Salta</option><option>Santa Fe</option><option>Neuquén</option><option>Bariloche</option><option>Paraná</option><option>Posadas</option><option>Corrientes</option><option>San Luis</option><option>Bahía Blanca</option></datalist>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div><div class="sug" id="sug" hidden></div><div id="toast"></div>
<!-- PASO 1: pegá tus datos de Supabase ENTRE LAS COMILLAS (sin borrar las comillas) -->
<script>
window.HOLPIN_URL="https://ufymsapavinnuulnpftq.supabase.co";
window.HOLPIN_KEY="sb_publishable_LQPL262JcfUHytP0PjI1pw_PsTfQesb";
window.addEventListener('error',function(e){var d=document.createElement('div');d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99;background:#ff3b30;color:#fff;padding:10px 14px;font:14px sans-serif';d.textContent='Error en la página: '+e.message;document.body.appendChild(d)});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL=window.HOLPIN_URL||'',SUPABASE_ANON_KEY=window.HOLPIN_KEY||'';

const $=s=>document.querySelector(s),H3=3*36e5;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nrm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const ini=(n,c)=>'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><rect width="80" height="80" fill="${c}"/><text x="40" y="53" font-size="36" font-family="Arial" fill="#fff" text-anchor="middle">${n[0]}</text></svg>`);
const fmt=w=>new Date(w).toLocaleString('es-AR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const money=n=>'$ '+Number(n).toLocaleString('es-AR');
const sg={get(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),t.length>60?6500:2800)}
function sheet(h,lock){$('#sheet').innerHTML=h;$('#ov').hidden=false;$('#ov').dataset.lock=lock?1:''}
function close(){$('#ov').hidden=true}
$('#ov').onclick=e=>{if(e.target.id==='ov'&&!$('#ov').dataset.lock)close()};

let sb=null;try{if(window.supabase&&/^https:\/\//.test(SUPABASE_URL)&&SUPABASE_ANON_KEY.length>20)sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){sb=null}
let uid=null,ready=false,profs={},trips=[],msgs=[],role=sg.get('holpin_role','pasajero'),view='buscar';
const dflt=ini('?','#8e8e93');
const who=id=>{const p=profs[id]||{};return{name:p.name||'Usuario',photo:/^data:image\//.test(p.photo||'')?p.photo:dflt}};
const meP=()=>uid?profs[uid]:null;
const live=()=>trips.filter(t=>!(t.soldOutAt&&Date.now()-t.soldOutAt>=H3));
function left(t){const ms=H3-(Date.now()-t.soldOutAt);return Math.floor(ms/36e5)+' h '+Math.ceil((ms%36e5)/6e4)+' min'}
const need=()=>{if(!uid){authSheet();return false}if(!meP()){profile(true);return false}return true};

async function load(){
 const [p,t,m]=await Promise.all([sb.from('profiles').select('id,name,photo'),sb.from('trips').select('*'),uid?sb.from('messages').select('*'):Promise.resolve({data:[]})]);
 if(p.error||t.error){$('#list').innerHTML='<div class="empty">No se pudieron cargar los datos. Revisá la configuración de Supabase.</div>';return}
 profs={};(p.data||[]).forEach(x=>profs[x.id]=x);
 trips=(t.data||[]).map(x=>({id:x.id,driverId:x.driver_id,from:x.origin,to:x.destination,when:x.departs_at,price:x.price,seats:x.seats,left:x.seats_left,soldOutAt:x.sold_out_at?new Date(x.sold_out_at).getTime():null}));
 msgs=(m.data||[]).map(x=>({id:x.id,tripId:x.trip_id,fromId:x.from_id,toId:x.to_id,text:x.body,route:x.route||'',ts:new Date(x.created_at).getTime(),read:x.read}));
 if(m.error&&!window._me){window._me=1;console.error(m.error);toast('No se pudieron cargar los mensajes: '+m.error.message)}
 ready=true;renderAll()}

const seen=new Set(),lastLeft=new Map();
function card(t,i=0){
 const out=t.left<=0,own=t.driverId===uid,w=who(t.driverId);
 let a='';
 if(own)a=`<span class="meta">Asientos libres</span><button class="btn sec sm" data-a="dec" data-id="${esc(t.id)}">−</button><b class="${lastLeft.has(t.id)&&lastLeft.get(t.id)!==t.left?'bump':''}">${t.left}/${t.seats}</b><button class="btn sec sm" data-a="inc" data-id="${esc(t.id)}">+</button><button class="btn sec sm" data-a="del" data-id="${esc(t.id)}" style="margin-left:auto;color:var(--red)">Eliminar</button>`;
 else a=`<button class="btn sm" data-a="ask" data-id="${esc(t.id)}" ${out?'disabled':''}>¿Sigue disponible?</button>`;
 return `<article class="card${seen.has(t.id)?'':' new'}" style="--i:${Math.min(i,8)}"><div class="row"><img class="av" src="${esc(w.photo)}" alt=""><div class="g"><b>${esc(w.name)}</b><br><small>Conductor</small></div><span class="price">${money(t.price)}</span></div>
 <div class="route">${esc(t.from)}<i>→</i>${esc(t.to)}</div><div class="meta">Sale ${fmt(t.when)}</div>
 <div class="meta" style="margin-top:6px">${out?`<span class="badge">Agotado</span> Desaparece en ${left(t)}`:`<span class="ok">${t.left} ${t.left===1?'asiento disponible':'asientos disponibles'}</span>`}</div>
 <div class="acts">${a}</div></article>`}
function renderList(){
 if(!ready)return;
 const f=nrm($('#qFrom').value),to=nrm($('#qTo').value),n=Date.now();
 const r=live().filter(t=>new Date(t.when).getTime()>n&&nrm(t.from).includes(f)&&nrm(t.to).includes(to)).sort((a,b)=>a.when<b.when?-1:1);
 $('#list').innerHTML=r.length?r.map(card).join(''):'<div class="empty">No hay viajes para esa búsqueda.</div>';
 const m=live().filter(t=>t.driverId===uid);
 $('#mine').innerHTML=m.length?m.map(card).join(''):'<div class="empty">Todavía no publicaste viajes.</div>';r.concat(m).forEach(x=>{seen.add(x.id);lastLeft.set(x.id,x.left)})}
let chat=null,marking=false;
const other=m=>m.fromId===uid?m.toId:m.fromId;
const ckey=m=>other(m)+'|'+(m.tripId||m.route);
function convs(){const g={};msgs.forEach(m=>{(g[ckey(m)]=g[ckey(m)]||[]).push(m)});
 return Object.entries(g).map(([k,a])=>{a.sort((x,y)=>x.ts-y.ts);const l=a[a.length-1];
  return{key:k,other:other(l),tripId:l.tripId,route:l.route,list:a,last:l,unread:a.filter(m=>m.toId===uid&&!m.read).length}}).sort((x,y)=>y.last.ts-x.last.ts)}
const seenM=new Set(),seenC=new Set();
const bubble=(m,i)=>`<div class="bub ${m.fromId===uid?'me':'th'}${seenM.has(m.id)?'':' new'}" style="--i:${i||0}">${esc(m.text)}<time>${new Date(m.ts).toLocaleString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}<button class="bdel" data-del="${esc(m.id)}">Eliminar</button></time></div>`;
function renderMsgs(){
 const box=$('#msgs');
 if(!uid){chat=null;box.dataset.mode='';box.innerHTML='<div class="empty">Iniciá sesión para ver tus mensajes.</div>';renderTabs();return}
 const cs=convs();
 if(chat){
  const c=cs.find(x=>x.key===chat.key),list=c?c.list:[],o=who(chat.other);
  if(box.dataset.mode!=='chat'){box.dataset.mode='chat';
   box.innerHTML=`<div class="chath"><button class="btn sec sm" id="cBack">‹ Volver</button><img class="av" src="${esc(o.photo)}" alt=""><div class="g"><b>${esc(o.name)}</b><br><small class="meta">${esc(chat.route)}</small></div><button class="btn sec sm" id="cDelAll" style="color:var(--red)">Eliminar chat</button></div><div id="cLog"></div><form id="cForm" class="cform"><input id="cTxt" placeholder="Escribí un mensaje…" autocomplete="off" maxlength="500"><button class="btn" id="cSend" type="submit">Enviar</button></form>`;
   $('#cBack').onclick=()=>{chat=null;renderMsgs()};
   $('#cForm').onsubmit=sendChat;
   $('#cLog').dataset.first=1}
  const log=$('#cLog'),near=log.dataset.first||log.scrollHeight-log.scrollTop-log.clientHeight<80;
  let k=0;log.innerHTML=list.length?list.map(m=>bubble(m,seenM.has(m.id)?0:Math.min(k++,10))).join(''):'<div class="empty">Escribí el primer mensaje.</div>';list.forEach(m=>seenM.add(m.id));
  if(near){log.scrollTop=log.scrollHeight;delete log.dataset.first}
  if(list.some(m=>m.toId===uid&&!m.read)&&!marking){marking=true;
   sb.from('messages').update({read:true}).eq('to_id',uid).eq('from_id',chat.other).eq('read',false).then(r=>{marking=false;if(!r.error)load()})}
 }else{
  box.dataset.mode='list';
  box.innerHTML=cs.length?cs.map((c,i)=>{const o=who(c.other),l=c.last;return `<div class="conv${seenC.has(c.key)?'':' new'}" style="--i:${Math.min(i,8)}" data-chat="${esc(c.key)}"><img class="av" src="${esc(o.photo)}" alt=""><div class="g"><b>${esc(o.name)}</b> <small class="meta">· ${esc(c.route)}</small><div class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l.fromId===uid?'Vos: ':''}${esc(l.text)}</div></div>${c.unread?`<span class="dot">${c.unread}</span>`:''}</div>`}).join(''):'<div class="empty">No tenés mensajes.</div>';cs.forEach(c=>seenC.add(c.key))}
 renderTabs()}
async function sendChat(e){e.preventDefault();
 const i=$('#cTxt'),x=i.value.trim();if(!x||!chat)return;
 $('#cSend').disabled=true;
 const r=await sb.from('messages').insert({trip_id:chat.tripId,from_id:uid,to_id:chat.other,body:x,route:chat.route});
 const b=$('#cSend');if(b)b.disabled=false;
 if(r.error){console.error(r.error);toast('No se pudo enviar: '+r.error.message);return}
 i.value='';await load();const t=$('#cTxt');if(t)t.focus()}
function armDel(btn,fn){
 if(btn.dataset.armed){fn();return}
 btn.dataset.armed=1;btn.dataset.label=btn.textContent;btn.textContent='¿Seguro?';
 setTimeout(()=>{if(btn.isConnected&&btn.dataset.armed){btn.dataset.armed='';btn.removeAttribute('data-armed');btn.textContent=btn.dataset.label}},3000)}
async function delMsg(id,btn){
 const bub=btn.closest('.bub');if(bub)bub.classList.add('out');
 await new Promise(r=>setTimeout(r,280));
 const r=await sb.from('messages').delete().eq('id',id).select();
 if(r.error||!r.data||!r.data.length){console.error(r.error);toast('No se pudo eliminar'+(r.error?': '+r.error.message:'. Falta la política de eliminación en Supabase.'));load();return}
 await load()}
async function delChat(){
 const c=convs().find(x=>x.key===chat.key);
 if(!c||!c.list.length){chat=null;renderMsgs();return}
 document.querySelectorAll('#cLog .bub').forEach(b=>b.classList.add('out'));
 await new Promise(r=>setTimeout(r,300));
 const r=await sb.from('messages').delete().in('id',c.list.map(m=>m.id)).select();
 if(r.error||!r.data||!r.data.length){console.error(r.error);toast('No se pudo eliminar'+(r.error?': '+r.error.message:'. Falta la política de eliminación en Supabase.'));load();return}
 chat=null;toast('Chat eliminado');await load()}
$('#msgs').onclick=e=>{
 const d=e.target.closest('[data-del]');if(d)return armDel(d,()=>delMsg(d.dataset.del,d));
 const da=e.target.closest('#cDelAll');if(da)return armDel(da,delChat);
 const b=e.target.closest('[data-chat]');if(!b)return;
 const c=convs().find(x=>x.key===b.dataset.chat);
 if(c){chat={key:c.key,other:c.other,tripId:c.tripId,route:c.route};renderMsgs();const i=$('#cTxt');if(i)i.focus()}};

/* ---- Avisos de mensajes nuevos ---- */
let swReg=null,ac=null;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{});
function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
 o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.15,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.35);
 o.connect(g);g.connect(ac.destination);o.start();o.stop(t+.36)}catch(e){}}
async function pushNote(title,body,icon){
 const opt={body,icon,tag:'holpin-msg',renotify:true};
 try{if(swReg&&swReg.showNotification){await swReg.showNotification(title,opt);return}}catch(e){}
 try{new Notification(title,opt)}catch(e){}}
function notify(m){
 const o=who(m.from_id),inChat=chat&&chat.other===m.from_id&&view==='mensajes'&&!document.hidden;
 if(inChat)return;
 beep();try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}
 if(document.hidden){if(!pushOn&&'Notification' in window&&Notification.permission==='granted')pushNote(o.name,m.body,o.photo)}
 else toast('Nuevo mensaje de '+o.name)}
const VAPID_PUBLIC='BAcF6yvUJWDuukXhThyw4SjPrCPJAFq0NclE6ciivyOwLiPz9sjqopDuuRJKMQtuDigaVQJV8SYBwS4jXTWFlZc';
let pushOn=false;
const u8=b=>{const s=atob((b+'='.repeat((4-b.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...s].map(c=>c.charCodeAt(0)))};
async function syncPush(ask){
 try{
  if(!uid||!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return false;
  if(Notification.permission==='default'&&ask)await Notification.requestPermission();
  if(Notification.permission!=='granted')return false;
  const reg=await Promise.race([navigator.serviceWorker.ready,new Promise((_,j)=>setTimeout(()=>j(new Error('no se encontró sw.js')),5000))]);
  let s=await reg.pushManager.getSubscription();
  if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID_PUBLIC)});
  const j=s.toJSON();
  const r=await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,user_id:uid,sub:j},{onConflict:'endpoint'});
  if(r.error){console.error(r.error);toast('No se pudo activar el aviso: '+r.error.message);return false}
  pushOn=true;renderTabs();return true
 }catch(e){console.error(e);toast('No se pudieron activar los avisos: '+e.message);return false}}
$('#bell').onclick=async()=>{
 const ok=await syncPush(true);
 if(ok)toast('Avisos activados');
 else if('Notification' in window&&Notification.permission==='denied')toast('Avisos bloqueados. Habilitalos desde el candado del navegador.');
 renderTabs()};
function renderTabs(){
 const un=msgs.filter(m=>m.toId===uid&&!m.read).length;
 document.title=(un?'('+un+') ':'')+'Holpin — Coordiná tus viajes';
 $('#bell').hidden=!(uid&&'Notification' in window&&Notification.permission!=='denied'&&!pushOn);
 const tabs=[['buscar','Viajes']].concat(role==='conductor'?[['publicar','Publicar']]:[],[['mensajes','Mensajes']]);
 $('#tabs').innerHTML=tabs.map(([k,l])=>`<button data-v="${k}" class="${view===k?'on':''}">${l}${k==='mensajes'&&un?`<span class="dot">${un}</span>`:''}</button>`).join('');
 $('#meBtn').innerHTML=meP()?`<img class="av" src="${esc(who(uid).photo)}" alt="">`:'<span class="btn sec sm">Entrar</span>'}
const renderAll=()=>{renderList();renderMsgs()};
function show(v){view=v;$('#roleSeg').hidden=v!=='buscar';$('#hero').hidden=v==='mensajes';setTimeout(movePill,0);['buscar','publicar','mensajes'].forEach(k=>$('#v-'+k).hidden=k!==v);
  renderAll()}
function setRole(r){role=r;sg.set('holpin_role',r);if(r!=='conductor'&&view==='publicar')view='buscar';

['#qFrom','#qTo'].forEach(s=>$(s).oninput=renderList);

function authSheet(){
 sheet(`<h3>Entrá a Holpin</h3><p>Creá una cuenta o iniciá sesión para publicar viajes y enviar mensajes.</p>
 <label>Email</label><input id="aE" type="email" autocomplete="email"><label style="margin-top:10px">Contraseña (mínimo 6 caracteres)</label><input id="aP" type="password" autocomplete="current-password">
 <div class="acts"><button class="btn" id="aIn">Iniciar sesión</button><button class="btn sec" id="aUp">Crear cuenta</button><button class="btn sec" id="aX">Cerrar</button></div>`);
 const go=async up=>{const email=$('#aE').value.trim(),password=$('#aP').value;
  if(!email||password.length<6)return toast('Ingresá un email y una contraseña de 6 o más caracteres');
  const r=up?await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin}}):await sb.auth.signInWithPassword({email,password});
  if(r.error)return toast(r.error.message==='Invalid login credentials'?'Email o contraseña incorrectos':r.error.message);
  if(up&&!r.data.session)toast('Revisá tu email para confirmar la cuenta')};
 $('#aIn').onclick=()=>go(false);$('#aUp').onclick=()=>go(true);$('#aX').onclick=close}

function profile(first){
 const p=meP();let photo=p?p.photo:'';
 sheet(`<h3>${first?'Creá tu perfil':'Tu perfil'}</h3><p>Para viajar o conducir necesitás un nombre y una foto.</p>
 <div class="pic"><img class="av" id="pPrev" src="${esc(photo||dflt)}" alt=""><label class="btn sec sm" style="margin:0;cursor:pointer">Elegir foto<input id="pFile" type="file" accept="image/*" hidden></label></div>
 <label>Nombre</label><input id="pName" value="${p?esc(p.name):''}" placeholder="Tu nombre" maxlength="30">
 <div class="acts"><button class="btn" id="pSave" disabled>Guardar</button>${first?'':'<button class="btn sec" id="pCancel">Cancelar</button>'}<button class="btn sec" id="pOut" style="margin-left:auto;color:var(--red)">Cerrar sesión</button></div>`,first);
 const chk=()=>$('#pSave').disabled=!($('#pName').value.trim()&&photo);
 $('#pName').oninput=chk;chk();
 if(!first)$('#pCancel').onclick=close;
 $('#pOut').onclick=async()=>{try{const reg=await navigator.serviceWorker.getRegistration();const s=reg&&await reg.pushManager.getSubscription();if(s){await sb.from('push_subscriptions').delete().eq('endpoint',s.endpoint);await s.unsubscribe()}}catch(e){}pushOn=false;await sb.auth.signOut();close()};
 $('#pFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);photo=c.toDataURL('image/jpeg',.8);$('#pPrev').src=photo;chk()};im.src=r.result};r.readAsDataURL(f)};
 $('#pSave').onclick=async()=>{const b=$('#pSave');b.disabled=true;
  const r=await sb.from('profiles').upsert({id:uid,name:$('#pName').value.trim(),photo});
  if(r.error){toast('No se pudo guardar el perfil');b.disabled=false;return}
  close();load()}}
$('#meBtn').onclick=()=>{if(!sb)return;uid?profile(false):authSheet()};

function ask(t){const w=who(t.driverId);
 chat={key:t.driverId+'|'+t.id,other:t.driverId,tripId:t.id,route:t.from+' → '+t.to};
 show('mensajes');
 const i=$('#cTxt');if(i){i.value=`Hola ${w.name}, ¿sigue disponible el viaje de ${t.from} a ${t.to} del ${fmt(t.when)}?`;i.focus()}}

async function onAct(e){
 const b=e.target.closest('[data-a]');if(!b)return;const t=trips.find(x=>x.id===b.dataset.id);if(!t)return;
 const a=b.dataset.a;
 if(a==='ask')return need()&&ask(t);
 if(t.driverId!==uid)return;
 let r;
 if(a==='del')r=await sb.from('trips').delete().eq('id',t.id);
 else if(a==='inc'&&t.left<t.seats)r=await sb.from('trips').update({seats_left:t.left+1,sold_out_at:null}).eq('id',t.id);
 else if(a==='dec'&&t.left>0)r=await sb.from('trips').update({seats_left:t.left-1,sold_out_at:t.left-1===0?new Date().toISOString():null}).eq('id',t.id);
 if(r&&r.error)toast('No se pudo actualizar');load()}
$('#list').onclick=onAct;$('#mine').onclick=onAct;

$('#pub').onclick=async()=>{
 if(!need())return;
 const v=id=>$(id).value.trim(),from=v('#pFrom'),to=v('#pTo'),d=v('#pDate'),h=v('#pTime'),p=+v('#pPrice'),s=+v('#pSeats');
 if(!from||!to||!d||!h||!(s>0)||v('#pPrice')==='')return toast('Completá todos los campos');
 const r=await sb.from('trips').insert({driver_id:uid,origin:from,destination:to,departs_at:new Date(d+'T'+h).toISOString(),price:p,seats:s,seats_left:s});
 if(r.error)return toast('No se pudo publicar el viaje');
 ['#pFrom','#pTo','#pDate','#pTime','#pPrice'].forEach(i=>$(i).value='');toast('Viaje publicado');await load();show('buscar')};

function boot(){
 if(!sb){$('#list').innerHTML='<div class="empty">Falta configurar Supabase: pegá tu URL y tu clave anon entre las comillas, al final del archivo, en el bloque «PASO 1».</div>';return}
 $('#list').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
 {const q=new URLSearchParams(location.hash.slice(1));
  if(q.get('error_code')||q.get('error_description')){
   const msg=q.get('error_code')==='otp_expired'?'El enlace de confirmación venció o ya se usó. Si ya confirmaste tu cuenta, iniciá sesión.':(q.get('error_description')||'No se pudo confirmar la cuenta');
   history.replaceState(null,'',location.pathname+location.search);
   setTimeout(()=>{toast(msg);authSheet()},700)}
  else if(q.get('type')==='signup'){
   setTimeout(()=>toast('¡Cuenta confirmada!'),700);
   setTimeout(()=>{if(!uid){toast('Tu cuenta está lista. Iniciá sesión para continuar.');authSheet()}},3000)}}
 sb.auth.onAuthStateChange((ev,s)=>{uid=s&&s.user?s.user.id:null;
  setTimeout(async()=>{await load();
   if(uid){syncPush(false);if(!$('#ov').hidden&&$('#sheet').querySelector('#aE'))close();if(!meP()&&$('#ov').hidden)profile(true)}},0)});
 sb.channel('holpin').on('postgres_changes',{event:'*',schema:'public'},p=>{
  if(p.table==='messages'&&p.eventType==='INSERT'&&p.new&&uid&&p.new.to_id===uid)notify(p.new);
  load()}).subscribe();
 setInterval(()=>{renderList();if(uid)sb.from('trips').delete().eq('driver_id',uid).lt('sold_out_at',new Date(Date.now()-H3).toISOString()).then(()=>{})},30000)}
const CITIES=['Buenos Aires','Córdoba','Rosario','Mendoza','La Plata','Mar del Plata','Tucumán','Salta','Santa Fe','Neuquén','Bariloche','Paraná','Posadas','Corrientes','San Luis','Bahía Blanca'];
let sugEl=null;
function sugShow(inp){
 const q=nrm(inp.value),s=new Set(CITIES);trips.forEach(t=>{s.add(t.from);s.add(t.to)});
 const r=[...s].filter(c=>nrm(c).includes(q)&&nrm(c)!==q).sort().slice(0,8),b=$('#sug');

 b.style.left=(rc.left+scrollX)+'px';b.style.top=(rc.bottom+scrollY+6)+'px';b.style.minWidth=rc.width+'px';

document.querySelectorAll('#qFrom,#qTo,#pFrom,#pTo').forEach(i=>{i.setAttribute('autocomplete','off');

$('#sug').addEventListener('mousedown',e=>{e.preventDefault();const d=e.target.closest('div');if(!d||!sugEl)return;

function movePill(){const b=document.querySelector('#roleSeg button.on'),p=document.querySelector('#roleSeg .pill');

addEventListener('load',movePill);addEventListener('resize',movePill);
setRole(role);boot();
